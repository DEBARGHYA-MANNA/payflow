<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="PayFlow — a simulated digital banking and payments app. Send money, manage cards and review payment history. No real funds involved."
    />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#06080E" />
    <meta name="application-name" content="PayFlow" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PayFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <!-- Icons (SVG fallback first, PNGs preferred when available) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090B17'/%3E%3Cpath d='M23 50V14h13.2c6.6 0 11.4 4.6 11.4 11.3S42.8 36.7 36.2 36.7H30V50h-7zm7-19.6h5.4c2.9 0 4.7-2 4.7-5.1s-1.8-5.1-4.7-5.1H30v10.2z' fill='%23C9F24F'/%3E%3C/svg%3E"
    />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="mask-icon" href="./icons/icon-192.png" color="#C9F24F" />

    <!-- Social -->
    <meta property="og:title" content="PayFlow" />
    <meta
      property="og:description"
      content="A simulated digital banking and payments experience."
    />
    <meta property="og:image" content="./icons/icon-512.png" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("payflow.theme") || "midnight";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <title>PayFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
